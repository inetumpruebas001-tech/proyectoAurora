[General]
# Ambiente por defecto (se sobrescribe con la variable de entorno AMBIENTE)
ambiente=dev
# Segundos máximos por petición
timeout_seg=60
# true para registrar cada escenario en Azure Table Storage (requiere variables AZURE_*)
log=false
Proyecto=Aurora Vida
Ciclo=-
# Individual = un Word por caso
Word=Individual
# true para validar el certificado TLS (servicios públicos con certificado válido)
verify_ssl=true
